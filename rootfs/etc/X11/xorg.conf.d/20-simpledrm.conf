Section "Monitor"
    Identifier "PhonePanel"
    Option "Rotate" "right"
EndSection

Section "Device"
    Identifier "UnicornDRM"
    Driver "modesetting"
    Option "Monitor-None-1" "PhonePanel"
    Option "Monitor-DSI-1" "PhonePanel"
    Option "AccelMethod" "glamor"
    Option "PageFlip" "true"
EndSection
