monitor.v4l2.rules = [
  {
    matches = [
      { device.product.name = "~Qualcomm Camera Subsystem*" }
      { device.description = "~Qualcomm Camera Subsystem*" }
      { node.description = "~Qualcomm Camera Subsystem*" }
      { device.bus-path = "~platform-acb7000.isp*" }
      { device.bus-path = "~platform-aa00000.video-codec*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
        node.disabled = true
      }
    }
  }
]

monitor.libcamera.rules = [
  {
    matches = [
      { node.name = "~libcamera_input.*i2c-bus_1_camera_10*" }
    ]
    actions = {
      update-props = {
        node.description = "主摄 1x (50MP IMX707)"
        node.nick = "主摄 1x"
        priority.session = 2000
      }
    }
  }
  {
    matches = [
      { node.name = "~libcamera_input.*i2c-bus_0_camera_10*" }
    ]
    actions = {
      update-props = {
        node.description = "前置 32MP 自拍 (OV32B40)"
        node.nick = "前置 32MP"
        priority.session = 1800
      }
    }
  }
  {
    matches = [
      { node.name = "~libcamera_input.*camera_3d*" }
    ]
    actions = {
      update-props = {
        node.description = "超广角 0.6x (50MP S5KJN1)"
        node.nick = "超广角 0.6x"
        priority.session = 1500
      }
    }
  }
  {
    matches = [
      { node.name = "~libcamera_input.*camera_2d*" }
    ]
    actions = {
      update-props = {
        node.description = "长焦 2x (50MP S5KJN1)"
        node.nick = "长焦 2x"
        priority.session = 1000
      }
    }
  }
]
